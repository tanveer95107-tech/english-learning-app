<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>English Master ULTRA</title>
<link rel="manifest" href="manifest.json">
<style>
/* --- ULTRA THEMES ENGINE --- */
:root{ --primary:#2563eb; --secondary:#0f172a; --background:#f5f7fb; --card:#ffffff; --text:#172033; --muted:#64748b; --border:#e2e8f0; }
body[data-theme="dark"]{ --background:#0f172a; --card:#1e293b; --text:#f8fafc; --border:#334155; }
body[data-theme="neon"]{ --background:#0a0a0a; --card:#111; --text:#39ff14; --primary:#39ff14; --border:#39ff14; }
body[data-theme="royal"]{ --background:#1a1a2e; --card:#16213e; --text:#ffd700; --primary:#ffd700; }
body[data-theme="sunset"]{ --background:#fff7ed; --card:#ffedd5; --text:#7c2d12; --primary:#f97316; }
body[data-theme="forest"]{ --background:#f0fdf4; --card:#dcfce7; --text:#14532d; --primary:#15803d; }
/* 47 aur themes aise add hongi */

* { box-sizing:border-box; margin:0; padding:0; }
body{ font-family:Arial,sans-serif; background:var(--background); color:var(--text); transition:.3s; }

/* --- SPLASH ANIMATION --- */
#splash{ position:fixed; inset:0; background:linear-gradient(135deg,#1d4ed8,#2563eb); color:white; display:flex; flex-direction:column; align-items:center; justify-content:center; z-index:9999; animation: splashOut 0.8s ease 2.2s forwards; }
@keyframes splashIn{ 0%{transform:scale(0) rotate(-20deg); opacity:0} 100%{transform:scale(1) rotate(0); opacity:1} }
@keyframes splashOut{ 0%{transform:translateY(0)} 100%{transform:translateY(-100%)} }
.splash-logo{ font-size:60px; animation:splashIn 1s ease; }

/* Tumhara purana CSS yahan rahega + mera naya */
header{ background:linear-gradient(135deg,var(--primary),#1d4ed8); color:white; padding:28px 18px; text-align:center; }
.topbar{ max-width:1050px; margin:15px auto 0; padding:0 15px; display:flex; gap:10px; }
.search{ flex:1; padding:13px 16px; border:1px solid var(--border); border-radius:10px; background:var(--card); color:var(--text); }
.top-btn{ border:0; border-radius:10px; padding:0 15px; background:var(--secondary); color:white; cursor:pointer; }
.container{ max-width:1050px; margin:auto; padding:20px 15px; }
/*... baki tumhara purana CSS same... */

/* ULTRA CARDS */
.ultra-badge{ background:linear-gradient(135deg,#f59e0b,#ef4444); color:white; padding:4px 10px; border-radius:20px; font-size:11px; font-weight:bold; }
.pro-lock{ position:relative; opacity:0.6; }
.pro-lock::after{ content:"🔒 ULTRA"; position:absolute; top:8px; right:8px; background:#0f172a; color:white; padding:2px 8px; border-radius:10px; font-size:10px; }
</style>
</head>
<body data-theme="light">

<div id="splash">
  <div class="splash-logo">🇬🇧</div>
  <h1 style="margin-top:10px">English Master</h1>
  <p>ULTRA Edition</p>
</div>

<header>
  <h1>🇬🇧 English Master <span class="ultra-badge">ULTRA</span></h1>
  <p>Learn • Practice • Improve • Earn</p>
  <div style="margin-top:12px">
    <button onclick="openThemeStore()" style="background:white;color:#2563eb;border:0;padding:8px 14px;border-radius:20px;font-weight:bold">🎨 50 Themes</button>
    <button onclick="buyUltra()" style="background:#f59e0b;color:black;border:0;padding:8px 14px;border-radius:20px;font-weight:bold;margin-left:8px">💎 Unlock Ultra Rs.999</button>
  </div>
</header>

<div class="topbar">
  <input id="search" class="search" type="search" placeholder="Search ANY English word - Live Dictionary..." oninput="searchApp(); liveDictionary(this.value)">
  <button class="top-btn" onclick="toggleDarkMode()">🌙</button>
</div>

<div id="themeStore" style="display:none;position:fixed;inset:0;background:rgba(0,0,0,.7);z-index:999;padding:20px;overflow:auto">
  <div style="background:var(--card);max-width:600px;margin:auto;border-radius:16px;padding:20px">
    <h2>🎨 Theme Store - 50 Themes</h2>
    <p>3 Free, 47 Ultra me</p>
    <div id="themeGrid" style="display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:15px"></div>
    <button onclick="closeThemeStore()" style="margin-top:15px;width:100%;padding:12px;background:var(--secondary);color:white;border:0;border-radius:10px">Close</button>
  </div>
</div>

<!-- TUMHARA PURANA CONTAINER SAME RAHEGA -->
<div class="container">
<!--... tumhara stats, grid, panels... -->
</div>

<script>
// === ULTRA LOGIC ===
let isUltra = localStorage.getItem('isUltra') === 'true';
let today = new Date().toDateString();
let dailyData = JSON.parse(localStorage.getItem('dailyData') || '{"date":"","count":0,"dict":0}');
if(dailyData.date!== today) dailyData = {date:today, count:0, dict:0};

const themes = [
  {id:'light', name:'Light - FREE', free:true},
  {id:'dark', name:'Dark - FREE', free:true},
  {id:'ocean', name:'Ocean Blue - FREE', free:true},
  {id:'neon', name:'Neon Hacker', free:false},
  {id:'royal', name:'Royal Gold', free:false},
  {id:'sunset', name:'Sunset', free:false},
  {id:'forest', name:'Forest', free:false},
  {id:'cyberpunk', name:'Cyberpunk', free:false},
  // 42 aur...
];

function openThemeStore(){
  document.getElementById('themeStore').style.display='block';
  let html=''; themes.forEach(t=>{
    let locked =!t.free &&!isUltra;
    html+=`<div class="pro-lock" style="${locked?'':''} border:1px solid var(--border);padding:12px;border-radius:10px;cursor:pointer" onclick="applyTheme('${t.id}', ${t.free})"><b>${t.name}</b><br>${locked?'<span style=color:red>🔒 Rs.999 me unlock</span>':'<span style=color:green>✓ Active</span>'}</div>`;
  });
  document.getElementById('themeGrid').innerHTML=html;
}
function closeThemeStore(){ document.getElementById('themeStore').style.display='none'; }
function applyTheme(id, isFree){
  if(!isFree &&!isUltra){ alert('Ye theme ULTRA me hai! Rs.999 me unlock karo.'); buyUltra(); return; }
  document.body.setAttribute('data-theme', id);
  localStorage.setItem('theme', id);
}
function buyUltra(){
  if(confirm('ULTRA Unlock karein Rs.999 Lifetime? Isme 47 Premium Themes + Unlimited Learning + Camera Dictionary + No Ads milega.')){
    localStorage.setItem('isUltra','true'); alert('ULTRA Unlocked! App reload ho rahi hai...'); location.reload();
  }
}
function checkLimit(){
  if(isUltra) return true;
  if(dailyData.count >= 15){ alert('Aaj ki 15 words ki limit khatam! Kal aao ya ULTRA Unlock karo Rs.999 me unlimited ke liye.'); return false; }
  dailyData.count++; localStorage.setItem('dailyData', JSON.stringify(dailyData)); return true;
}
async function liveDictionary(word){
  if(word.length < 3) return;
  if(!isUltra && dailyData.dict >=5){ document.getElementById('content').innerHTML='<p style=color:red>Free Dictionary limit 5/day. ULTRA lo unlimited.</p>'; return; }
  try{
    let res = await fetch(`https://api.dictionaryapi.dev/api/v2/entries/en/${word}`);
    let data = await res.json(); if(data[0]){
      if(!isUltra) { dailyData.dict++; localStorage.setItem('dailyData', JSON.stringify(dailyData)); }
      // yahan meaning dikhao
    }
  }catch(e){}
}

// Splash auto hide
setTimeout(()=>{ document.getElementById('splash').style.display='none'; }, 3000);
// Load saved theme
let savedTheme = localStorage.getItem('theme') || 'light';
document.body.setAttribute('data-theme', savedTheme);
</script>

<!-- TUMHARA PURANA SCRIPT SAME COPY KARNA HAI YAHAN -->
<script>
//... tumhara purana vocabulary, quiz, progress wala script yahan paste rahega...
</script>

</body>
</html>
